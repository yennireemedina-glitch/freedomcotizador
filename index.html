<div id="forgot-feedback-msg" class="hidden mt-3 text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 p-2.5 rounded-lg text-center"></div>
        <div class="mt-4 flex justify-end gap-2">
          <button type="button" onclick="closeForgotPasswordModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-600">Cancelar</button>
          <button type="button" onclick="submitForgotPassword()" class="px-4 py-2 rounded-xl bg-brandBlue text-white text-xs font-extrabold">Notificar a Directora</button>
        </div>
      </div>
    </div>

    <script>
      // --- MOTOR PRINCIPAL INMEDIATO (NUNCA SE BLOQUEA EN VERCEL / GITHUB) ---
      let app, db, auth;
      let cloudSynced = false;
      // Canal público en la nube para sincronizar agentes entre todos los dispositivos en Vercel/GitHub automáticamente
      const PUBLIC_CLOUD_SYNC_URL = "https://jsonblob.com/api/jsonBlob/1344745189219426304";

      window.agentProfile = {
        name: "Y. Medina",
        email: "ymedina@gofreedomif.com",
        phone: "(305) 555-0199"
      };

      // Función de fusión inteligente para que los agentes registrados NUNCA se borren ni se sobrescriban
      window.mergeAgentsLists = function(listA = [], listB = []) {
        const map = new Map();
        [...listA, ...listB].forEach(ag => {
          if (ag && ag.username) {
            const key = String(ag.username).trim().toLowerCase();
            if (ag._deleted) {
              map.delete(key);
              return;
            }
            const existing = map.get(key);
            if (!existing || (ag.updatedAt || 0) >= (existing.updatedAt || 0)) {
              map.set(key, { ...existing, ...ag });
            }
          }
        });
        return Array.from(map.values());
      };

      window.portalSystemConfig = {
        portalActive: true,
        maintenanceMessage: "El portal de cotización se encuentra temporalmente en pausa por la Dirección.",
        directorUser: "ymedina@gofreedomif.com",
        directorPass: "Freedomif18",
        directorName: "Y. Medina (Directora)",
        agents: [
          {
            id: "ag-1",
            name: "Carlos Ruiz",
            username: "agente1",
            password: "1234",
            email: "cruiz@freedominsurance.com",
            phone: "(786) 555-0100",
            active: true,
            registeredAt: "Permanente",
            updatedAt: 1700000000000
          }
        ]
      };

      // Cargar lista de agentes guardada localmente de forma permanente (Nunca vence a los 30 días)
      try {
        const savedPortalCfg = localStorage.getItem('freedom_portal_config_v1');
        if (savedPortalCfg) {
          const parsedCfg = JSON.parse(savedPortalCfg);
          if (parsedCfg) {
            const mergedAgents = window.mergeAgentsLists(window.portalSystemConfig.agents, parsedCfg.agents || []);
            window.portalSystemConfig = {
              ...window.portalSystemConfig,
              ...parsedCfg,
              directorUser: parsedCfg.directorUser || "ymedina@gofreedomif.com",
              directorPass: parsedCfg.directorPass || "Freedomif18",
              agents: mergedAgents
            };
          }
        }
      } catch (e) {}

      // Cargar credenciales recordadas permanentemente en el dispositivo del agente o directora
      window.loadRememberedDeviceCredentials = function() {
        try {
          const chk = document.getElementById('login-remember-me');
          if (chk) chk.checked = true; // Marcado por defecto para que siempre recuerde al usuario
          const savedCreds = localStorage.getItem('freedom_device_saved_login');
          if (savedCreds) {
            const { u, p, profile } = JSON.parse(savedCreds);
            const uEl = document.getElementById('login-username');
            const pEl = document.getElementById('login-password');
            if (uEl && u) uEl.value = u;
            if (pEl && p) pEl.value = p;
            if (profile && profile.name) {
              window.agentProfile = { ...window.agentProfile, ...profile };
            }
          }
        } catch (e) {}
      };

      // Sincronización Cloud Global Automática para Vercel / GitHub
      window.pullGlobalVercelAgents = async function() {
        try {
          const res = await fetch(PUBLIC_CLOUD_SYNC_URL, { method: 'GET', headers: { 'Accept': 'application/json' } });
          if (res.ok) {
            const remoteData = await res.json();
            if (remoteData && Array.isArray(remoteData.agents)) {
              window.portalSystemConfig.agents = window.mergeAgentsLists(window.portalSystemConfig.agents, remoteData.agents);
              localStorage.setItem('freedom_portal_config_v1', JSON.stringify(window.portalSystemConfig));
              updateCloudStatusPill(true, `Sincronización Global Activa (${window.portalSystemConfig.agents.length} Agentes)`);
              if (window.currentSessionUser && window.currentSessionUser.role === 'director') {
                renderDirectorModalContent();
              }
            }
          }
        } catch (err) {}
      };

      window.pushGlobalVercelAgents = async function() {
        try {
          // Primero traemos los que haya en la nube para no pisar a nadie y luego subimos la lista fusionada
          try {
            const getRes = await fetch(PUBLIC_CLOUD_SYNC_URL, { method: 'GET', headers: { 'Accept': 'application/json' } });
            if (getRes.ok) {
              const rem = await getRes.json();
              if (rem && Array.isArray(rem.agents)) {
                window.portalSystemConfig.agents = window.mergeAgentsLists(rem.agents, window.portalSystemConfig.agents);
              }
            }
          } catch (e) {}

          await fetch(PUBLIC_CLOUD_SYNC_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              updatedAt: Date.now(),
              agents: window.portalSystemConfig.agents
            })
          });
          localStorage.setItem('freedom_portal_config_v1', JSON.stringify(window.portalSystemConfig));
          updateCloudStatusPill(true, `Sincronización Global Activa (${window.portalSystemConfig.agents.length} Agentes)`);
        } catch (err) {}
      };

      window.currentSessionUser = null;
      let visiblePasswords = {};
      window.activeQuickFilter = 'SUNCARE';
      window.showingOnlySelected = false;
      window.selectedCompare = [];

      window.updateCloudStatusPill = function(isConnected, msg) {
        const pill = document.getElementById('cloud-connection-pill');
        if (!pill) return;
        if (isConnected) {
          pill.className = "text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-300";
          pill.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> ${msg || 'Sincronización Cloud En Vivo Activa'}`;
        } else {
          pill.className = "text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 border border-amber-300";
          pill.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-600 mr-1"></i> ${msg || 'Memoria Permanente Activa'}`;
        }
      };

      // Inicializar Firebase + Nube Global de manera dinámica sin bloquear el Login
      async function initCloudFirebase() {
        loadRememberedDeviceCredentials();
        await window.pullGlobalVercelAgents();
        // Revisar nuevos agentes registrados cada 20 segundos automáticamente
        setInterval(() => {
          window.pullGlobalVercelAgents();
        }, 20000);

        let firebaseConfig = null;
        try {
          const savedCustomFb = localStorage.getItem('freedom_custom_firebase_config');
          if (savedCustomFb) {
            firebaseConfig = JSON.parse(savedCustomFb);
          } else if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
          }
        } catch (e) {}

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'freedom-insurance-portal';

        if (!firebaseConfig || !firebaseConfig.apiKey || String(firebaseConfig.apiKey).includes('DummyKey')) {
          updateCloudStatusPill(true, `Memoria Permanente Activa (${window.portalSystemConfig.agents.length} Agentes)`);
          return;
        }

        try {
          const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
          const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
          const { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

          window._fbHelpers = { doc, getDoc, setDoc, collection, appId };

          app = initializeApp(firebaseConfig);
          db = getFirestore(app);
          auth = getAuth(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          const user = auth.currentUser;
          if (!user) return;

          const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'portalSettings', 'mainConfig');
          const agentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'registeredAgents');

          onSnapshot(configDocRef, (docSnap) => {
            if (docSnap.exists()) {
              const data = docSnap.data();
              if (data.portalSystemConfig) {
                const merged = window.mergeAgentsLists(window.portalSystemConfig.agents, data.portalSystemConfig.agents || []);
                window.portalSystemConfig = {
                  ...window.portalSystemConfig,
                  ...data.portalSystemConfig,
                  agents: merged
                };
                try {
                  localStorage.setItem('freedom_portal_config_v1', JSON.stringify(window.portalSystemConfig));
                } catch (err) {}
              }
              cloudSynced = true;
              updateCloudStatusPill(true, `Nube Conectada (${window.portalSystemConfig.agents.length} Agentes)`);
              if (window.currentSessionUser && window.currentSessionUser.role === 'director') {
                renderDirectorModalContent();
              }
            } else {
              setDoc(configDocRef, { portalSystemConfig: window.portalSystemConfig });
            }
          }, (error) => {
            updateCloudStatusPill(false, "Memoria Permanente Local Activa");
          });

          onSnapshot(agentsColRef, (snapshot) => {
            const cloudAgents = [];
            snapshot.forEach(docItem => {
              const agData = docItem.data();
              if (agData && agData.username) cloudAgents.push(agData);
            });
            if (cloudAgents.length > 0) {
              window.portalSystemConfig.agents = window.mergeAgentsLists(window.portalSystemConfig.agents, cloudAgents);
              try {
                localStorage.setItem('freedom_portal_config_v1', JSON.stringify(window.portalSystemConfig));
              } catch (err) {}
              updateCloudStatusPill(true, `Sincronizado en Vivo (${window.portalSystemConfig.agents.length} Agentes)`);
              if (window.currentSessionUser && window.currentSessionUser.role === 'director') {
                renderDirectorModalContent();
              }
            }
          });
        } catch (e) {
          updateCloudStatusPill(false, "Memoria Permanente del Dispositivo Activa");
        }
      }

      window.savePortalConfigToCloud = async function(singleAgent = null) {
        try {
          localStorage.setItem('freedom_portal_config_v1', JSON.stringify(window.portalSystemConfig));
        } catch (err) {}
        // Sincronizar siempre con el canal global para Vercel / GitHub
        await window.pushGlobalVercelAgents();

        if (!auth || !auth.currentUser || !db || !window._fbHelpers) {
          showToast("Guardado permanentemente en la nube de la agencia.");
          return;
        }
        try {
          const { doc, setDoc, appId } = window._fbHelpers;
          const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'portalSettings', 'mainConfig');
          await setDoc(configDocRef, { portalSystemConfig: window.portalSystemConfig });

          if (singleAgent && singleAgent.username) {
            const agentDocId = singleAgent.username.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
            const agentDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'registeredAgents', agentDocId);
            await setDoc(agentDocRef, singleAgent);
          }
          showToast("Sincronizado permanentemente en la nube.");
        } catch (e) {
          showToast("Guardado en memoria permanente.");
        }
      };

      window.syncCloudNow = async function() {
        await window.pullGlobalVercelAgents();
        if (!auth || !auth.currentUser || !db || !window._fbHelpers) {
          renderDirectorModalContent();
          showToast(`¡Sincronizado! (${window.portalSystemConfig.agents.length} agentes registrados)`);
          return;
        }
        try {
          const { doc, getDoc, appId } = window._fbHelpers;
          const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'portalSettings', 'mainConfig');
          const snap = await getDoc(configDocRef);
          if (snap.exists() && snap.data().portalSystemConfig) {
            window.portalSystemConfig.agents = window.mergeAgentsLists(
              window.portalSystemConfig.agents,
              snap.data().portalSystemConfig.agents || []
            );
            localStorage.setItem('freedom_portal_config_v1', JSON.stringify(window.portalSystemConfig));
            renderDirectorModalContent();
            showToast(`¡Lista sincronizada! (${window.portalSystemConfig.agents.length} agentes activos)`);
          }
        } catch (e) {
          showToast("Lista de agentes refrescada.");
        }
      };

        window.exportAgentsBackup = function() {
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.portalSystemConfig, null, 2));
          const dlAnchor = document.createElement('a');
          dlAnchor.setAttribute("href", dataStr);
          dlAnchor.setAttribute("download", `respaldo_agentes_freedom_${new Date().toISOString().slice(0,10)}.json`);
          document.body.appendChild(dlAnchor);
          dlAnchor.click();
          dlAnchor.remove();
          showToast("Respaldo de agentes descargado.");
        };

        window.importAgentsBackup = function(event) {
          const file = event.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              const imported = JSON.parse(e.target.result);
              const importedAgents = Array.isArray(imported) ? imported : (imported.agents || []);
              window.portalSystemConfig.agents = window.mergeAgentsLists(window.portalSystemConfig.agents, importedAgents);
              renderDirectorModalContent();
              savePortalConfigToCloud();
              showToast(`¡${importedAgents.length} agentes unidos permanentemente!`);
            } catch (err) {
              showToast("El archivo seleccionado no tiene un formato válido.");
            }
          };
          reader.readAsText(file);
        };

        window.saveCustomFirebaseConfig = function() {
          const raw = document.getElementById('custom-firebase-json').value.trim();
          if (!raw) return;
          try {
            const parsed = JSON.parse(raw);
            if (!parsed.apiKey || !parsed.projectId) {
              showToast("El JSON debe incluir al menos apiKey y projectId.");
              return;
            }
            localStorage.setItem('freedom_custom_firebase_config', JSON.stringify(parsed));
            showToast("¡Firebase conectado! Recargando conexión en vivo...");
            setTimeout(() => location.reload(), 1000);
          } catch (e) {
            showToast("Formato JSON inválido. Asegúrate de usar comillas dobles.");
          }
        };

        window.saveDeviceLoginPreference = function(u, p) {
          const remember = document.getElementById('login-remember-me')?.checked;
          if (remember !== false) {
            try {
              localStorage.setItem('freedom_device_saved_login', JSON.stringify({
                u,
                p,
                profile: window.agentProfile,
                savedAt: Date.now()
              }));
            } catch (e) {}
          } else {
            localStorage.removeItem('freedom_device_saved_login');
          }
        };

        window.handleLoginSubmit = async function(e) {
          if (e) e.preventDefault();
          const uInput = (document.getElementById('login-username')?.value || '').trim().toLowerCase();
          const pInput = (document.getElementById('login-password')?.value || '').trim();
          const errBox = document.getElementById('login-error-msg');
          if (errBox) errBox.classList.add('hidden');

          const dirUser = (portalSystemConfig.directorUser || 'ymedina@gofreedomif.com').trim().toLowerCase();
          const dirPass = (portalSystemConfig.directorPass || 'Freedomif18').trim();

          // Permitir acceso directo a la Directora con su correo o con "ymedina"
          if ((uInput === dirUser || uInput === 'ymedina@gofreedomif.com' || uInput === 'ymedina') && (pInput === dirPass || pInput === 'Freedomif18')) {
            window.currentSessionUser = { name: portalSystemConfig.directorName, role: 'director', email: portalSystemConfig.directorUser };
            window.agentProfile = {
              name: "Y. Medina",
              email: "ymedina@gofreedomif.com",
              phone: "(305) 555-0199"
            };
            saveDeviceLoginPreference(uInput, pInput);
            finalizeSuccessfulLogin();
            window.pullGlobalVercelAgents();
            return;
          }

          // Si el agente se registró en otro dispositivo, sincronizamos primero con la nube global
          let matchedAgent = (portalSystemConfig.agents || []).find(ag => {
            const agUser = String(ag.username || '').trim().toLowerCase();
            const agEmail = String(ag.email || '').trim().toLowerCase();
            const agPass = String(ag.password || '').trim();
            return (agUser === uInput || agEmail === uInput) && agPass === pInput;
          });

          if (!matchedAgent) {
            await window.pullGlobalVercelAgents();
            matchedAgent = (portalSystemConfig.agents || []).find(ag => {
              const agUser = String(ag.username || '').trim().toLowerCase();
              const agEmail = String(ag.email || '').trim().toLowerCase();
              const agPass = String(ag.password || '').trim();
              return (agUser === uInput || agEmail === uInput) && agPass === pInput;
            });
          }

          if (matchedAgent) {
            if (matchedAgent.active === false) {
              errBox.textContent = "Tu cuenta se encuentra bloqueada por la Directora. Contacta a administración.";
              errBox.classList.remove('hidden');
              return;
            }
            window.currentSessionUser = { name: matchedAgent.name, role: 'agent', email: matchedAgent.email || matchedAgent.username };
            window.agentProfile = {
              name: matchedAgent.name,
              email: matchedAgent.email || portalSystemConfig.directorUser,
              phone: matchedAgent.phone || "(305) 555-0199"
            };
            saveDeviceLoginPreference(uInput, pInput);
            finalizeSuccessfulLogin();
            return;
          }

          errBox.textContent = "Usuario o clave incorrectos. Verifica tus datos o regístrate como nuevo agente.";
          errBox.classList.remove('hidden');
        };

        function finalizeSuccessfulLogin() {
          const overlay = document.getElementById('login-overlay');
          if (overlay) overlay.classList.add('hidden');
          const agentNameSpan = document.getElementById('header-agent-name');
          if (agentNameSpan) agentNameSpan.textContent = window.agentProfile.name;
          const dirBtn = document.getElementById('btn-director-panel');
          if (dirBtn) {
            if (window.currentSessionUser && window.currentSessionUser.role === 'director') {
              dirBtn.classList.remove('hidden');
            } else {
              dirBtn.classList.add('hidden');
            }
          }
          showToast(`¡Bienvenido(a), ${window.agentProfile.name}!`);
          renderPlans();
        }

        window.logoutSession = function() {
          window.currentSessionUser = null;
          const overlay = document.getElementById('login-overlay');
          if (overlay) overlay.classList.remove('hidden');
          const pEl = document.getElementById('login-password');
          if (pEl) pEl.value = '';
          showToast("Sesión cerrada correctamente.");
        };

        window.toggleLoginPasswordVisibility = function() {
          const pEl = document.getElementById('login-password');
          const icon = document.getElementById('login-eye-icon');
          if (!pEl) return;
          if (pEl.type === 'password') {
            pEl.type = 'text';
            if (icon) icon.className = "fa-solid fa-eye-slash";
          } else {
            pEl.type = 'password';
            if (icon) icon.className = "fa-solid fa-eye";
          }
        };

        window.openAgentModal = function() {
          const m = document.getElementById('agent-modal');
          document.getElementById('ag-modal-name').value = window.agentProfile.name;
          document.getElementById('ag-modal-email').value = window.agentProfile.email;
          document.getElementById('ag-modal-phone').value = window.agentProfile.phone;
          m.classList.remove('hidden'); m.classList.add('flex');
        };

        window.closeAgentModal = function() {
          document.getElementById('agent-modal').classList.add('hidden');
          document.getElementById('agent-modal').classList.remove('flex');
        };

        window.saveAgentProfile = function() {
          window.agentProfile.name = document.getElementById('ag-modal-name').value.trim() || "Y. Medina";
          window.agentProfile.email = document.getElementById('ag-modal-email').value.trim() || "ymedina@gofreedomif.com";
          window.agentProfile.phone = document.getElementById('ag-modal-phone').value.trim() || "(305) 555-0199";
          const agentNameSpan = document.getElementById('header-agent-name');
          if (agentNameSpan) agentNameSpan.textContent = window.agentProfile.name;
          // Guardar permanentemente los datos del perfil del agente en el dispositivo y actualizar su ficha
          try {
            const savedCreds = localStorage.getItem('freedom_device_saved_login');
            if (savedCreds) {
              const parsed = JSON.parse(savedCreds);
              parsed.profile = window.agentProfile;
              localStorage.setItem('freedom_device_saved_login', JSON.stringify(parsed));
            }
          } catch (e) {}
          closeAgentModal();
          showToast("Perfil de asesor guardado permanentemente.");
        };

        window.openDirectorModal = async function() {
          await window.pullGlobalVercelAgents();
          renderDirectorModalContent();
          const m = document.getElementById('director-modal');
          m.classList.remove('hidden'); m.classList.add('flex');
        };

        window.closeDirectorModal = function() {
          document.getElementById('director-modal').classList.add('hidden');
          document.getElementById('director-modal').classList.remove('flex');
        };

        window.renderDirectorModalContent = function() {
          document.getElementById('dir-admin-user').value = portalSystemConfig.directorUser;
          document.getElementById('dir-admin-pass').value = portalSystemConfig.directorPass;
          document.getElementById('dir-maintenance-msg').value = portalSystemConfig.maintenanceMessage;

          const statusCard = document.getElementById('dir-portal-status-card');
          statusCard.innerHTML = `
            <div class="bg-emerald-50 border border-emerald-300 rounded-2xl p-4 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-base">
                  <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                  <h4 class="font-extrabold text-emerald-950 text-sm">Portal Activo y Sincronizado</h4>
                  <p class="text-[11px] text-emerald-800">Total de agentes registrados con memoria permanente: <strong>${portalSystemConfig.agents.length}</strong></p>
                </div>
              </div>
            </div>
          `;

          document.getElementById('dir-agents-count').textContent = `${portalSystemConfig.agents.length} Agentes`;
          const tbody = document.getElementById('dir-agents-tbody');
          if (!tbody) return;

          tbody.innerHTML = portalSystemConfig.agents.map(ag => {
            const isVis = visiblePasswords[ag.id];
            return `
              <tr class="border-b border-slate-100 hover:bg-slate-50/80">
                <td class="p-3">
                  <div class="font-extrabold text-brandBlue">${ag.name}</div>
                  <div class="text-[11px] text-slate-500">${ag.email || 'Sin email'} • ${ag.phone || 'Sin teléfono'}</div>
                </td>
                <td class="p-3 font-mono font-bold text-slate-700">${ag.username}</td>
                <td class="p-3 font-mono">
                  <div class="flex items-center gap-1.5">
                    <span>${isVis ? ag.password : '••••••••'}</span>
                    <button type="button" onclick="toggleDirectorAgentPassword('${ag.id}')" class="text-slate-400 hover:text-brandBlue">
                      <i class="fa-solid ${isVis ? 'fa-eye-slash' : 'fa-eye'}"></i>
                    </button>
                  </div>
                </td>
                <td class="p-3">
                  <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${ag.active !== false ? 'bg-emerald-100 text-emerald-900 border border-emerald-200' : 'bg-red-100 text-red-900 border border-red-200'}">
                    ${ag.active !== false ? 'Activo' : 'Bloqueado'}
                  </span>
                  <div class="text-[10px] text-slate-400 mt-0.5">${ag.registeredAt || 'Permanente'}</div>
                </td>
                <td class="p-3 text-right">
                  <div class="flex items-center justify-end gap-1.5">
                    <button type="button" onclick="editAgent('${ag.id}')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-2.5 py-1 rounded-lg text-[11px]">Editar</button>
                    <button type="button" onclick="toggleAgentStatus('${ag.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-lg text-[11px]">${ag.active !== false ? 'Bloquear' : 'Activar'}</button>

          const name = document.getElementById('ag-form-name').value.trim();
          const username = document.getElementById('ag-form-user').value.trim().toLowerCase();
          const password = document.getElementById('ag-form-pass').value.trim();
          const email = document.getElementById('ag-form-email').value.trim();

            showToast("Completa los campos obligatorios del agente.");

            if (idx > -1) {
              portalSystemConfig.agents[idx] = {
                ...portalSystemConfig.agents[idx],
                name, username, password, email, phone,
                updatedAt: Date.now()
              };
              showToast("Agente actualizado correctamente.");

              name, username, password, email, phone,
              active: true,
              registeredAt: new Date().toLocaleDateString('es-ES'),

        function calculateOopDynamicPrice(plan, age, tier) {
          const band = getOopBandKey(age);
          const sel = window.oopPlanSelections[plan.id] || { daily: '100', surgery: '0', er: false };
          let base = 0;
          const admMap = plan.oopAdmLevel === 2500 ? OOP_FL_RATES.adm2500 : (plan.oopAdmLevel === 5000 ? OOP_FL_RATES.adm5000 : OOP_FL_RATES.adm6350);
          base += admMap[band]?.[tier] || 0;
          if (sel.daily === '100') base += OOP_FL_RATES.daily100[band]?.[tier] || 0;
          else if (sel.daily === '200') base += OOP_FL_RATES.daily200[band]?.[tier] || 0;
          if (sel.surgery === '1000') base += OOP_FL_RATES.surg1000[band]?.[tier] || 0;
          else if (sel.surgery === '2000') base += OOP_FL_RATES.surg2000[band]?.[tier] || 0;
          else if (sel.surgery === '3000') base += OOP_FL_RATES.surg3000[band]?.[tier] || 0;
          if (sel.er) base += OOP_FL_RATES.er250[band]?.[tier] || 0;
          return base;
        }
